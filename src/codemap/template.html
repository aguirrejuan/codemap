<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codemap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --raise: #ffffff; --text: #17191e; --muted: #6a707c; --faint: #9aa0aa;
  --border: #e2e4e9; --border-2: #d3d6dc; --hover: #f0f1f4;
  --pkg: rgba(110, 118, 135, .045); --mod: #ffffff; --cls: rgba(59, 111, 214, .045); --sym: #ffffff; --ext: rgba(110, 118, 135, .05);
  --edge: #a9aeb8; --hl: #4f5bd5; --hl-soft: rgba(79, 91, 213, .12);
  --changed: #d93f3f; --changed-bg: #fdf0f0; --aff: #c7811a; --aff-bg: #fdf5e7; --aff2-bg: #fefaf2;
  --code-bg: #f7f8fa; --code-chg: rgba(217, 63, 63, .1);
  --k-pkg: #a0772a; --k-mod: #2f8a5a; --k-cls: #3b6fd6; --k-fn: #8a4fd0; --k-ext: #7d8390; --k-const: #1d8a8f; --cyc: #d93f3f;
  --shadow: 0 1px 2px rgba(20, 24, 33, .05), 0 1px 1px rgba(20, 24, 33, .03);
  --shadow-lg: 0 8px 24px rgba(20, 24, 33, .08), 0 2px 6px rgba(20, 24, 33, .05);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #16181d; --raise: #1c1f25; --text: #e7e9ee; --muted: #9298a4; --faint: #646a75;
    --border: #262a32; --border-2: #323742; --hover: #1f232a;
    --pkg: rgba(255, 255, 255, .018); --mod: #16181d; --cls: rgba(110, 150, 240, .05); --sym: #1c1f25; --ext: rgba(255, 255, 255, .025);
    --edge: #4f5562; --hl: #8b95ff; --hl-soft: rgba(139, 149, 255, .16);
    --changed: #f47272; --changed-bg: #2c1717; --aff: #e9a440; --aff-bg: #2a2012; --aff2-bg: #211b12;
    --code-bg: #121419; --code-chg: rgba(244, 114, 114, .13);
    --k-pkg: #d7ad5e; --k-mod: #5fc58f; --k-cls: #79a5f5; --k-fn: #b590f3; --k-ext: #8d93a0; --k-const: #5cc6c9; --cyc: #f47272;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #16181d; --raise: #1c1f25; --text: #e7e9ee; --muted: #9298a4; --faint: #646a75;
  --border: #262a32; --border-2: #323742; --hover: #1f232a;
  --pkg: rgba(255, 255, 255, .018); --mod: #16181d; --cls: rgba(110, 150, 240, .05); --sym: #1c1f25; --ext: rgba(255, 255, 255, .025);
  --edge: #4f5562; --hl: #8b95ff; --hl-soft: rgba(139, 149, 255, .16);
  --changed: #f47272; --changed-bg: #2c1717; --aff: #e9a440; --aff-bg: #2a2012; --aff2-bg: #211b12;
  --code-bg: #121419; --code-chg: rgba(244, 114, 114, .13);
  --k-pkg: #d7ad5e; --k-mod: #5fc58f; --k-cls: #79a5f5; --k-fn: #b590f3; --k-ext: #8d93a0; --k-const: #5cc6c9; --cyc: #f47272;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body, #app { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
#app { display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }

/* header */
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.logo { width: 28px; height: 28px; flex: none; border-radius: 7px; background: var(--text); color: var(--panel); display: grid; place-items: center; }
.logo svg { width: 16px; height: 16px; }
.titles { min-width: 0; }
h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
h1 .sep { color: var(--faint); font-weight: 400; margin: 0 6px; }
.summary { color: var(--muted); font-size: 12px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.searchbox { position: relative; }
.searchbox svg { position: absolute; left: 9px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
input[type=search] { font-size: 13px; height: 30px; padding: 0 10px 0 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); width: 260px; max-width: 100%; transition: border-color .15s, box-shadow .15s, background .15s; }
input[type=search]:focus { outline: none; background: var(--panel); border-color: var(--hl); box-shadow: 0 0 0 3px var(--hl-soft); }
input[type=search]::placeholder { color: var(--faint); }
.iconbtn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.iconbtn svg { width: 15px; height: 15px; }

/* banners under the header: the diff and the import cycles */
.banners:empty { display: none; }
.banners { display: flex; flex-direction: column; gap: 6px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.banner { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 12.5px; }
.banner .tag { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.banner.pr .tag { background: var(--changed-bg); color: var(--changed); }
.banner.cyc .tag { background: var(--changed-bg); color: var(--cyc); }
.banner.cyc a { color: var(--text); cursor: pointer; font-size: 12px; padding: 1px 8px; border: 1px solid var(--border); border-radius: 999px; transition: border-color .15s, color .15s; }
.banner.cyc a:hover { border-color: var(--cyc); color: var(--cyc); }
.banner .hint { font-size: 12px; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 3px 11px; font-size: 12.5px; border-radius: 7px; cursor: pointer; transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow), 0 0 0 1px var(--border); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
label.chk { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
label.chk:hover { color: var(--text); }
label.chk:has(input:checked) { color: var(--text); }
label.chk input { appearance: none; -webkit-appearance: none; margin: 0; width: 26px; height: 16px; border-radius: 999px; background: var(--border-2); position: relative; cursor: pointer; transition: background .18s; flex: none; }
label.chk input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .18s; }
label.chk input:checked { background: var(--hl); }
label.chk input:checked::before { transform: translateX(10px); }
button.plain, a.plain { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; height: 28px; padding: 0 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; }
button.plain:hover, a.plain:hover { background: var(--hover); border-color: var(--border-2); text-decoration: none; }
button.plain.primary { background: var(--hl); border-color: var(--hl); color: #fff; }
button.plain.primary:hover { filter: brightness(1.08); background: var(--hl); }
.nodebar { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); }
.nodebar button { height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--text); font: 500 12px var(--sans); cursor: pointer; white-space: nowrap; }
.nodebar button:hover { background: var(--hover); }
.nodebar button.primary { background: var(--hl); color: #fff; }
.nodebar button.primary:hover { filter: brightness(1.08); }
.nodebar .n { color: var(--muted); margin-left: 4px; }
.nodebar button.primary .n { color: rgba(255,255,255,.75); }
.focuschip { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 2px 3px 2px 11px; background: var(--hl-soft); color: var(--text); border-radius: 9px; }
.focuschip b { font-weight: 600; }
.focuschip .lbl { color: var(--hl); font-weight: 600; }
.focuschip .seg { background: var(--panel); }
.focuschip .seg button { padding: 1px 8px; }
.focuschip .x { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.focuschip .x:hover { background: var(--panel); color: var(--text); }

/* layout */
main { flex: 1; display: flex; min-height: 0; }
.canvas { flex: 1; min-width: 0; position: relative; }
aside { flex: none; width: 400px; border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; font-size: 13px; }
.resizer { flex: none; width: 7px; margin: 0 -4px 0 -3px; position: relative; z-index: 6; cursor: col-resize; touch-action: none; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: transparent; transition: background .15s; }
.resizer:hover::after, .resizer.drag::after { background: var(--hl); width: 2px; }
body.resizing { cursor: col-resize; user-select: none; }
.iconbtn.on { color: var(--hl); background: var(--hl-soft); border-color: transparent; }
.pane { padding: 18px 20px 28px; }
.pane-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
aside h2 { font-size: 17px; font-weight: 650; letter-spacing: -.015em; margin: 0; word-break: break-all; }
aside .meta { color: var(--muted); margin: 2px 0 0; word-break: break-all; font-size: 12px; }
aside .path { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
aside h3 { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 8px; }
aside h3 .count { font-weight: 500; color: var(--faint); letter-spacing: 0; }
aside ul { list-style: none; margin: 0 -8px; padding: 0; }
aside li { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; min-width: 0; }
aside li:hover { background: var(--hover); }
aside li a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
aside li .n { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
aside a { color: var(--text); cursor: pointer; text-decoration: none; }
aside li a:hover { color: var(--hl); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.hint { color: var(--muted); }
.empty { color: var(--faint); font-size: 12px; margin: 0; }
.callout { margin-top: 18px; padding: 10px 12px; border-radius: 8px; background: var(--changed-bg); color: var(--text); font-size: 12.5px; }
.callout b { color: var(--cyc); }
.callout .actions { margin-top: 8px; }
.callout.idle { background: var(--aff-bg); }
.callout.idle b { color: var(--aff); }
.intro p { margin: 0 0 10px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; margin: 16px 0 0; font-size: 12.5px; color: var(--muted); }
kbd { font: 500 11px var(--sans); padding: 1px 6px; border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 5px; color: var(--text); background: var(--bg); white-space: nowrap; justify-self: start; }
.cyclist li { flex-wrap: wrap; }
.cyclist li a { flex: none; font-family: var(--sans); font-weight: 600; color: var(--cyc); }
.cyclist li .hint { flex: 1; min-width: 0; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; font-size: 10.5px; line-height: 16px; padding: 0 6px; border-radius: 999px; margin-left: 6px; font-weight: 600; flex: none; }
.badge.h0 { background: var(--changed); color: #fff; }
.badge.h1, .badge.h2 { background: var(--aff-bg); color: var(--aff); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--aff) 35%, transparent); }
.badge.focus { background: var(--hl); color: #fff; }
.badge.cyc { color: var(--cyc); box-shadow: inset 0 0 0 1px var(--cyc); }
.badge.none { color: var(--muted); box-shadow: inset 0 0 0 1px var(--border-2); border: 0; background: repeating-linear-gradient(135deg, transparent 0 3px, var(--hover) 3px 5px); }
.badge.hub { background: var(--hl-soft); color: var(--hl); }
.pill { display: inline-flex; align-items: center; font: 600 10px/16px var(--mono); padding: 0 6px; border-radius: 5px; text-transform: uppercase; letter-spacing: .03em; color: var(--kc); background: color-mix(in srgb, var(--kc) 13%, transparent); flex: none; }
pre.code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 0; margin: 0; font: 11.5px/1.6 var(--mono); overflow: auto; max-height: 440px; }
pre.code div { padding: 0 12px 0 0; white-space: pre; }
pre.code div.chg { background: var(--code-chg); box-shadow: inset 2px 0 0 var(--changed); }
pre.code .ln { display: inline-block; width: 42px; padding-right: 12px; text-align: right; color: var(--faint); user-select: none; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
.overlay > div { pointer-events: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; max-width: 420px; box-shadow: var(--shadow-lg); }
.busy { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; box-shadow: var(--shadow-lg); }
.busy::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border-2); border-top-color: var(--hl); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { padding: 24px; color: var(--muted); }
.legend { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: calc(100% - 220px); font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; box-shadow: var(--shadow); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; }
.ln-sw { width: 20px; height: 0; border-top: 1.5px solid var(--edge); }
.ln-sw.dot { border-top-style: dotted; border-top-width: 2px; }
.ln-sw.dash { border-top-style: dashed; }
.ln-sw.read { border-top: 0; height: 1.5px; background: repeating-linear-gradient(90deg, var(--edge) 0 6px, transparent 6px 8px, var(--edge) 8px 10px, transparent 10px 12px); }

/* graph */
.react-flow { background: var(--bg); }
.react-flow__edge { pointer-events: none; }
.react-flow__handle { opacity: 0; width: 1px; height: 1px; min-width: 0; min-height: 0; border: 0; }
.react-flow__node { cursor: pointer; }
.card { position: relative; width: 100%; height: 100%; background: var(--sym); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px 6px 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; box-shadow: var(--shadow); overflow: hidden; transition: opacity .2s, box-shadow .15s, border-color .15s, transform .15s; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--kc); opacity: .85; }
.card:hover { border-color: var(--border-2); box-shadow: var(--shadow-lg); }
.top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em; }
.cmeta { font-size: 11px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; }
.kind { font: 600 9px/15px var(--mono); padding: 0 4px; border-radius: 4px; flex: none; text-transform: uppercase; letter-spacing: .03em; color: var(--kc); background: color-mix(in srgb, var(--kc) 13%, transparent); }
.k-package { --kc: var(--k-pkg); } .k-module { --kc: var(--k-mod); } .k-class { --kc: var(--k-cls); } .k-function, .k-method { --kc: var(--k-fn); } .k-external { --kc: var(--k-ext); } .k-toplevel { --kc: var(--k-mod); } .k-constant { --kc: var(--k-const); }
.box { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 12px; transition: opacity .2s, box-shadow .15s, border-color .15s; }
.box.package { background: var(--pkg); border-style: dashed; border-color: var(--border-2); }
.box.module { background: var(--mod); box-shadow: var(--shadow); }
.box.class { background: var(--cls); border-color: color-mix(in srgb, var(--k-cls) 22%, var(--border)); }
.box.external { background: var(--ext); border-style: dotted; border-color: var(--border-2); }
.card.ext { background: var(--ext); border-style: dashed; box-shadow: none; }
.box-head { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 11px 11px 0 0; }
.box:hover { border-color: color-mix(in srgb, var(--hl) 45%, var(--border)); }
.box-head .name { font-size: 12px; }
.box.package > .box-head .name { color: var(--muted); }
.box-head .cmeta { margin-left: 2px; color: var(--faint); }
/* no callers fades to an outline; most-called gets the highlight blue. The diff colours below win. */
.card.idle { background: transparent; border-style: dashed; border-color: var(--border-2); box-shadow: none; }
.card.idle::before { background: var(--faint); }
.card.idle .name, .box.idle > .box-head .name { color: var(--muted); font-weight: 500; }
.box.idle { border-style: dashed; }
.card.hub, .box.hub { border-color: color-mix(in srgb, var(--hl) 55%, transparent); }
.card.hub { background: color-mix(in srgb, var(--hl) 8%, var(--sym)); }
.card.hub::before { background: var(--hl); opacity: 1; width: 4px; }
.box.hub > .box-head { background: linear-gradient(90deg, var(--hl-soft), transparent 85%); }
.card.h0 { background: var(--changed-bg); border-color: color-mix(in srgb, var(--changed) 55%, transparent); }
.card.h0::before { background: var(--changed); opacity: 1; width: 4px; }
.card.h1 { background: var(--aff-bg); border-color: color-mix(in srgb, var(--aff) 50%, transparent); }
.card.h1::before, .card.h2::before { background: var(--aff); opacity: 1; }
.card.h2 { background: var(--aff2-bg); border-color: color-mix(in srgb, var(--aff) 30%, transparent); }
.box.h0 { border-color: color-mix(in srgb, var(--changed) 50%, transparent); }
.box.h1, .box.h2 { border-color: color-mix(in srgb, var(--aff) 45%, transparent); }
.box.h0 > .box-head { background: linear-gradient(90deg, var(--changed-bg), transparent 85%); }
.box.h1 > .box-head, .box.h2 > .box-head { background: linear-gradient(90deg, var(--aff2-bg), transparent 85%); }
.sel.card, .sel.box, .focused.card, .focused.box { border-color: var(--hl); box-shadow: 0 0 0 3px var(--hl-soft), var(--shadow-lg); }
.dim { opacity: .45; }
.dim.card { box-shadow: none; }
.faded { opacity: .28; }
.react-flow__edge-path { stroke: var(--edge); stroke-width: 1.25; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s, stroke-width .15s; }
.react-flow__edge { transition: opacity .2s; }
.react-flow__edge.references .react-flow__edge-path { stroke-dasharray: 1 4; stroke-width: 1.6; }
.react-flow__edge.imports .react-flow__edge-path { stroke-dasharray: 5 4; stroke-width: 1; }
.react-flow__edge.reads .react-flow__edge-path { stroke-dasharray: 6 2 2 2; }
.react-flow__edge.hot .react-flow__edge-path { stroke: var(--aff); stroke-width: 1.7; }
.react-flow__edge.cyc .react-flow__edge-path { stroke: var(--cyc); stroke-width: 1.7; }
.react-flow__edge.hl .react-flow__edge-path { stroke: var(--hl); stroke-width: 2.2; }
.react-flow__edge.faded { opacity: .1; }
.react-flow__edge.dimmed { opacity: .3; }
.react-flow__edge-textbg { fill: var(--panel); stroke: var(--border-2); stroke-width: 1; }
.react-flow__edge-text { fill: var(--muted); font: 600 9.5px var(--sans); }

<svg id="cm-defs" width="0" height="0" style="position:absolute" aria-hidden="true">

  </defs>
</svg>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script>
const D = /*DATA*/null;

if (typeof React === 'undefined' || typeof ReactFlow === 'undefined' || typeof ELK === 'undefined') {
  document.getElementById('app').innerHTML =
    '<p class="note">The graph needs React, React Flow and ELK from a CDN. Check the network connection and reload.</p>';
  throw new Error('codemap: libraries missing');
}

const {createElement: h, useState, useEffect, useMemo, useRef} = React;
const RF = window.ReactFlow;
const Flow = RF.ReactFlow || RF.default;
const {ReactFlowProvider, Handle, Position, BaseEdge, MiniMap, Controls, Background, NodeToolbar} = RF;
let ACT = null;  // the App's actions, which the node toolbar calls; React Flow wants node types defined once

// ---- the tree ---------------------------------------------------------------

const RANK = {package: 0, module: 1, class: 2, function: 3, method: 3, toplevel: 3, constant: 3, external: 0};
const LEVEL = {package: 0, module: 1, class: 2, function: 3};
const TAG = {package: 'pkg', module: 'mod', class: 'cls', function: 'fn', method: 'fn', toplevel: 'top', constant: 'const', external: 'ext'};

// External packages sit in one box at the edge, split into third-party and stdlib.
const EXT = '@external';
const extNodes = D.nodes.filter(n => n.kind === 'external');
if (extNodes.length) {
  const groups = [{id: EXT, kind: 'external', parent: null, label: 'external', group: true}];
  for (const [id, label, std] of [[EXT + '.third', 'third-party', false], [EXT + '.stdlib', 'stdlib', true]]) {
    const mine = extNodes.filter(n => !!n.stdlib === std);
    if (mine.length) groups.push({id, kind: 'external', parent: EXT, label, group: true});
    for (const n of mine) n.parent = id;
  }
  D.nodes.push(...groups);
}
// A module's code outside any function gets a card of its own. Once the module opens, the calls
// that code makes leave from the card instead of from the box's border, beside its functions' calls.
{
  const all = new Map(D.nodes.map(n => [n.id, n])), parents = new Set(D.nodes.map(n => n.parent));
  const tops = new Map();
  for (const e of D.edges) {
    const m = all.get(e[0]);
    if (!m || e[2] === 'imports' || m.kind !== 'module' || !parents.has(m.id)) continue;
    if (!tops.has(m.id)) tops.set(m.id, {id: m.id + '.<top>', kind: 'toplevel', parent: m.id, label: 'module code', file: m.file, line: 1});
    e[0] = tops.get(m.id).id;
  }
  D.nodes.push(...tops.values());
  const hops = D.diff && D.diff.hops;
  if (hops) for (const [m, t] of tops) if (m in hops) hops[t.id] = hops[m];
}
// Third-party packages show from the top level; stdlib folds into one card until Modules.
const rankOf = id => id === EXT || id === EXT + '.third' ? -1 : RANK[byId.get(id).kind];
const LIMIT = 700;  // boxes beyond which ELK takes seconds; we ask first
const byId = new Map(D.nodes.map(n => [n.id, n]));
const kids = new Map();
for (const n of D.nodes) if (n.parent) { if (!kids.has(n.parent)) kids.set(n.parent, []); kids.get(n.parent).push(n.id); }
const roots = D.nodes.filter(n => !n.parent).map(n => n.id);
const hops = (D.diff && D.diff.hops) || {};
const sources = D.sources || {};

function chain(id) { const c = []; while (id) { c.push(id); id = byId.get(id).parent; } return c; }
function inside(id) { const s = new Set([id]), st = [id]; while (st.length) for (const k of kids.get(st.pop()) || []) { s.add(k); st.push(k); } return s; }

const subHop = new Map();
function hopOf(id) {  // a box is affected if anything inside it is
  if (subHop.has(id)) return subHop.get(id);
  let v = id in hops ? hops[id] : undefined;
  for (const k of kids.get(id) || []) { const kh = hopOf(k); if (kh !== undefined && (v === undefined || kh < v)) v = kh; }
  subHop.set(id, v);
  return v;
}
const symCount = new Map();
function symbols(id) {
  if (symCount.has(id)) return symCount.get(id);
  const n = byId.get(id);
  let c = (n.kind === 'class' || n.kind === 'function' || n.kind === 'method') ? 1 : 0;
  for (const k of kids.get(id) || []) c += symbols(k);
  symCount.set(id, c);
  return c;
}
const TEST = /^(tests?|testing|conftest)$|^test_|_tests?$/;
const isTest = id => id.split('.').some(p => TEST.test(p));
const hasTests = D.nodes.some(n => n.kind === 'module' && isTest(n.id));
const isExt = id => byId.get(id).kind === 'external';

// Hubs: the most-called symbols, roughly the top 5% by distinct callers and never fewer than 5.
const byFanIn = D.nodes.filter(n => n.fan_in && !isTest(n.id)).sort((a, b) => b.fan_in - a.fan_in);
const byFanOut = D.nodes.filter(n => n.fan_out && !isTest(n.id)).sort((a, b) => b.fan_out - a.fan_out);
const HUB = Math.max(5, byFanIn.length ? byFanIn[Math.floor(byFanIn.length * 0.05)].fan_in : 0);
const hubs = new Set(byFanIn.filter(n => n.fan_in >= HUB).map(n => n.id));
const idle = D.nodes.filter(n => n.uncalled).sort((a, b) => a.id < b.id ? -1 : 1);
const plural = (k, word) => `${k} ${word}${k === 1 ? '' : 's'}`;
function flagOf(id) {
  const n = byId.get(id);
  if (n.uncalled) return {cls: 'none', text: 'no callers', title: 'Nothing in the repo calls this or passes it by name'};
  if (hubs.has(id)) return {cls: 'hub', text: plural(n.fan_in, 'caller'), title: 'One of the most-called symbols in the repo'};
  return null;
}
const importers = new Map();
for (const [s, t, kind] of D.edges) if (kind === 'imports' && isExt(t)) importers.set(t, (importers.get(t) || 0) + 1);

// Import cycles: the modules in each, and the module-to-module edges that close them.
const cycles = D.cycles || [], cycleOf = new Map(), cycEdge = new Set();
cycles.forEach((c, i) => {
  for (const m of c.modules) cycleOf.set(m, i);
  for (const [a, b] of c.edges) cycEdge.add(a + '\u0000' + b);
});

// Neighbours for focus mode, both directions.
const adj = new Map();
for (const [s, t, kind] of D.edges) {
  for (const [a, b] of [[s, t], [t, s]]) { if (!adj.has(a)) adj.set(a, []); adj.get(a).push([b, kind]); }
}

function focusSet(st) {
  const start = [...inside(st.focus)];
  const keep = id => (!st.hideTests || !isTest(id) || isTest(st.focus)) && (st.ext || !isExt(id) || isExt(st.focus));
  const seen = new Set(start);
  let frontier = start;
  for (let d = 0; d < st.depth; d++) {
    const next = [];
    for (const id of frontier) for (const [o, kind] of adj.get(id) || []) {
      if (kind === 'imports' && !st.imports && !isExt(id) && !isExt(o)) continue;
      if (!seen.has(o) && keep(o)) { seen.add(o); next.push(o); }
    }
    frontier = next;
  }
  return seen;
}

// What is on screen: visible ids, which of them are open boxes, and folded edges.
function computeView(st) {
  let include, open;
  const imports = st.imports || st.cycle !== null;
  if (st.focus || st.cycle !== null) {
    const I = st.focus ? focusSet(st) : new Set(cycles[st.cycle].modules), anc = new Set();
    for (const id of I) for (const a of chain(id).slice(1)) anc.add(a);
    include = id => I.has(id) || anc.has(id);
    open = id => anc.has(id);
  } else {
    include = id => !(st.hideTests && isTest(id)) && !(st.pr && st.blastOnly && hopOf(id) === undefined) && (st.ext || !isExt(id))
      && (byId.get(id).kind !== 'constant' || id in hops);  // constants show only when the diff reaches them
    open = id => st.expanded.has(id) || (!st.collapsed.has(id) && rankOf(id) < LEVEL[st.level]);
  }
  const vis = [], visSet = new Set();
  const walk = id => {
    if (!include(id)) return;
    vis.push(id); visSet.add(id);
    if (open(id)) for (const k of kids.get(id) || []) walk(k);
  };
  roots.forEach(walk);
  const box = new Set(vis.filter(id => open(id) && (kids.get(id) || []).some(k => visSet.has(k))));
  const rep = id => {
    const c = chain(id);
    for (let i = c.length - 1; i > 0; i--) {
      if (!visSet.has(c[i])) return null;
      if (!box.has(c[i])) return c[i];
    }
    return visSet.has(c[0]) ? c[0] : null;
  };
  const agg = new Map(), cyc = new Set();
  for (const [s, t, kind, c] of D.edges) {
    if (kind === 'imports' && !imports && !isExt(t)) continue;
    if (kind === 'reads' && !include(t)) continue;  // a hidden constant folds into nothing
    const a = rep(s), b = rep(t);
    if (!a || !b || a === b) continue;
    if (chain(a).includes(b) || chain(b).includes(a)) continue;  // a box and its own contents
    const key = a + '\u0000' + b + '\u0000' + kind;
    agg.set(key, (agg.get(key) || 0) + c);
    if (kind === 'imports' && cycEdge.has(s + '\u0000' + t)) cyc.add(key);
  }
  const edges = [...agg].map(([key, count]) => { const [a, b, kind] = key.split('\u0000'); return {id: key, a, b, kind, count, cyc: cyc.has(key)}; });
  return {vis, box, edges, rep};
}

// ---- sizes and layout ---------------------------------------------------------

const ctx = document.createElement('canvas').getContext('2d');
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
function textW(s, font) { ctx.font = font; return ctx.measureText(s).width; }

function metaText(id) {
  const n = byId.get(id), c = symbols(id);
  if (n.kind === 'external') {
    const k = n.group ? [...inside(id)].filter(x => !byId.get(x).group).length : importers.get(id) || 0;
    return n.group ? `${k} package${k === 1 ? '' : 's'}` : `${k} importer${k === 1 ? '' : 's'}`;
  }
  if (n.kind === 'toplevel') return 'outside any function';
  if (n.kind === 'constant') return n.loc > 1 ? `constant, ${n.loc} lines` : 'constant';
  if (n.kind === 'function' || n.kind === 'method') return n.loc ? `${n.loc} lines` : '';
  if (n.kind === 'class') return `${c - 1} method${c === 2 ? '' : 's'}`;
  return `${c} symbol${c === 1 ? '' : 's'}`;
}
function label(id) { const n = byId.get(id); return n.kind === 'package' ? n.label + '/' : n.label; }

const elk = new ELK();
const ROOT_OPTS = {
  'elk.algorithm': 'layered', 'elk.direction': 'RIGHT', 'elk.hierarchyHandling': 'INCLUDE_CHILDREN',
  'elk.edgeRouting': 'ORTHOGONAL',
  'elk.layered.spacing.nodeNodeBetweenLayers': '56', 'elk.spacing.nodeNode': '18',
  'elk.layered.spacing.edgeNodeBetweenLayers': '18', 'elk.spacing.edgeNode': '14', 'elk.spacing.edgeEdge': '8',
  'elk.layered.nodePlacement.strategy': 'BRANDES_KOEPF', 'elk.spacing.componentComponent': '36',

async function layout(view) {

  for (const id of view.vis) {
    const n = byId.get(id), lw = textW(label(id), `600 12px ${FONT}`), mw = textW(metaText(id), `11px ${FONT}`);
    const e = {id, children: []}, badge = (D.diff && hopOf(id) !== undefined ? 62 : 0) + (cycleOf.has(id) ? 46 : 0) + (flagOf(id) ? 76 : 0);
    if (view.box.has(id)) {  // tag, name, meta and badge share the header

        'elk.nodeSize.constraints': 'MINIMUM_SIZE', 'elk.nodeSize.minimum': `(${Math.ceil(lw + mw + badge + 72)},60)`};
    } else {  // tag and name on top, meta and badge below
      e.width = Math.min(320, Math.max(120, Math.ceil(Math.max(lw + 50 + 6 * (TAG[n.kind] || '').length, mw + badge + 26))));
      e.height = 50;

    (n.parent && nodes.has(n.parent) ? nodes.get(n.parent) : root).children.push(e);
  }
  for (const [id, e] of nodes) {  // hidden edges stack external packages into columns, not one tall one
    const n = byId.get(id), k = e.children.length;
    if (!(n.group && n.parent) || !view.box.has(id) || k < 8) continue;
    const rows = Math.ceil(k / Math.max(1, Math.round(Math.sqrt(k / 3))));
    e.edges = [];
    for (let i = 0; i + rows < k; i++) e.edges.push({id: '__grid' + id + i, sources: [e.children[i].id], targets: [e.children[i + rows].id]});
  }

    const up = new Set(chain(ed.a).slice(1));
    const lca = chain(ed.b).slice(1).find(x => up.has(x) && nodes.has(x));
    (lca ? nodes.get(lca) : root).edges = [...((lca ? nodes.get(lca) : root).edges || []), {id: ed.id, sources: [ed.a], targets: [ed.b]}];
  }
  const res = await elk.layout(root);

  const out = [], abs = new Map();
  const walk = (n, parent, ox, oy) => {
    for (const c of n.children || []) {
      const ax = ox + c.x, ay = oy + c.y;
      abs.set(c.id, {x: ax, y: ay, w: c.width, h: c.height});
      out.push({id: c.id, parent, x: c.x, y: c.y, w: c.width, h: c.height});
      walk(c, c.id, ax, ay);

  const pts = new Map();
  const walkE = (n, ox, oy) => {  // edge points are relative to the box holding the edge
    for (const e of n.edges || []) {
      const s = e.sections && e.sections[0];
      if (s) pts.set(e.id, [s.startPoint, ...(s.bendPoints || []), s.endPoint].map(q => ({x: q.x + ox, y: q.y + oy})));

  walkE(res, 0, 0);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const b of abs.values()) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }

// ---- graph components ------------------------------------------------------------

function Handles() {
  return [h(Handle, {key: 't', type: 'target', position: Position.Left, isConnectable: false}),
          h(Handle, {key: 's', type: 'source', position: Position.Right, isConnectable: false})];
}
function Badge({hop, focus, cyc, flag}) {
  const out = [];
  if (focus) out.push(h('span', {key: 'f', className: 'badge focus'}, 'focus'));
  else if (hop !== undefined) out.push(h('span', {key: 'h', className: 'badge h' + Math.min(hop, 2)}, hop === 0 ? 'changed' : 'hop ' + hop));
  if (cyc) out.push(h('span', {key: 'c', className: 'badge cyc'}, 'cycle'));
  if (flag) out.push(h('span', {key: 'x', className: 'badge ' + flag.cls, title: flag.title}, flag.text));
  return out;
}
function Bar({data}) {  // Focus and Open/Close float over the selected box, so they work with the panel hidden
  const b = data.bar;
  if (!b) return null;
  const stop = f => e => { e.stopPropagation(); f(); };
  return h(NodeToolbar, {isVisible: true, position: Position.Top, offset: 8},
    h('div', {className: 'nodebar'},
      b.focused ? h('button', {onClick: stop(() => ACT.focus(null))}, 'Exit focus')
                : h('button', {className: 'primary', onClick: stop(() => ACT.focus(data.id))}, 'Focus'),
      b.kids ? h('button', {onClick: stop(() => ACT.toggle(data.id))}, b.open ? 'Close' : 'Open', h('span', {className: 'n'}, b.kids)) : null));

function Card({data}) {

    h(Bar, {data}),
    ...Handles(),
    h('div', {className: 'top'}, h('span', {className: 'kind k-' + data.kind}, TAG[data.kind]), h('span', {className: 'name'}, data.label)),
    h('div', {className: 'cmeta'}, data.meta, h(Badge, {hop: data.hop, focus: data.focus, cyc: data.cyc, flag: data.flag})));
}
function Box({data}) {
  return h('div', {className: 'box k-' + data.kind + ' ' + data.kind + ' ' + data.cls, title: data.id},
    h(Bar, {data}),
    ...Handles(),
    h('div', {className: 'box-head'},
      h('span', {className: 'kind k-' + data.kind}, TAG[data.kind]),
      h('span', {className: 'name'}, data.label),
      h('span', {className: 'cmeta'}, data.meta, h(Badge, {hop: data.hop, focus: data.focus, cyc: data.cyc, flag: data.flag}))));
}
function roundPath(p, r = 8) {  // ELK's orthogonal route with its corners rounded
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [a, c, b] = [p[i - 1], p[i], p[i + 1]];
    const la = Math.hypot(c.x - a.x, c.y - a.y), lb = Math.hypot(b.x - c.x, b.y - c.y);

    const s = {x: c.x + (a.x - c.x) * k / la, y: c.y + (a.y - c.y) * k / la};
    const e = {x: c.x + (b.x - c.x) * k / lb, y: c.y + (b.y - c.y) * k / lb};
    d += ` L${s.x},${s.y} Q${c.x},${c.y} ${e.x},${e.y}`;

}
function FlowEdge({id, data, markerEnd}) {
  const p = data.points;

  const path = roundPath(p);
  let best = 0, lx = p[0].x, ly = p[0].y;
  for (let i = 1; i < p.length; i++) {  // label the longest segment
    const len = Math.abs(p[i].x - p[i - 1].x) + Math.abs(p[i].y - p[i - 1].y);
    if (len > best) { best = len; lx = (p[i].x + p[i - 1].x) / 2; ly = (p[i].y + p[i - 1].y) / 2; }
  }
  return h(BaseEdge, {id, path, markerEnd, interactionWidth: 0,
    label: data.count > 1 ? String(data.count) : undefined, labelX: lx, labelY: ly,
    labelShowBg: true, labelBgPadding: [5, 2], labelBgBorderRadius: 8});
}
const nodeTypes = {card: Card, box: Box};
const edgeTypes = {flow: FlowEdge};

// ---- side panel ---------------------------------------------------------------------

const changedLines = file => ((D.diff && D.diff.lines) || {})[file] || [];
function Code({node}) {
  const text = node.file && sources[node.file];
  if (!text || node.kind === 'package') return null;
  const all = text.split('\n');
